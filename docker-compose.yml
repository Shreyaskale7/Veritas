# Veritas: Postgres + API (with scheduler) + web (Caddy, HTTPS).   docker compose up -d --build
# Copy .env.example to .env and set real secrets first. NOT exercised in the development environment (no Docker daemon there).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: veritas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      VERITAS_APP_PASSWORD: ${VERITAS_APP_PASSWORD:?set VERITAS_APP_PASSWORD in .env}
      VERITAS_DEMO: ${VERITAS_DEMO:-0}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sh:/docker-entrypoint-initdb.d/10-veritas.sh:ro
      - ./schema.sql:/sql/schema.sql:ro
      - ./seed.sql:/sql/seed.sql:ro
      - ./app_bootstrap.sql:/sql/app_bootstrap.sql:ro
      - ./demo_data.sql:/sql/demo_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d veritas"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://veritas_login:${VERITAS_APP_PASSWORD}@db:5432/veritas
      ADMIN_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/veritas
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      SESSION_HTTPS: "1"
      CORS_ORIGINS: https://${VERITAS_DOMAIN:-localhost}
      VERITAS_PUBLIC_URL: https://${VERITAS_DOMAIN:-localhost}
      WITNESS_TYPE: git
      WITNESS_GIT_DIR: /witness
      WITNESS_GIT_REMOTE: ${WITNESS_GIT_REMOTE:-}
      INTEGRITY_WEBHOOK: ${INTEGRITY_WEBHOOK:-}
      SMTP_HOST: ${SMTP_HOST:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
    volumes:
      - witness:/witness
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    depends_on:
      - api
    environment:
      VERITAS_DOMAIN: ${VERITAS_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
    restart: unless-stopped

volumes:
  pgdata:
  witness:
  caddy_data:
